<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Squircle Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#111C35"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#3B82F6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Metallic Titanium Body Gradient -->
    <linearGradient id="metalBodyL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="metalBodyR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Blade Stem Facet Dark -->
    <linearGradient id="bladeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Silicone Ear Tip Gradient -->
    <radialGradient id="earTip" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Cyan/Blue Blade Light LED Strip -->
    <linearGradient id="bladeLed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.7"/>
    </filter>

    <!-- Neon Glow for Blade LED -->
    <filter id="ledGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#centerGlow)"/>

  <!-- Subtle Acoustic ANC Soundwave Arcs -->
  <g fill="none" stroke="#38BDF8" stroke-linecap="round" opacity="0.22">
    <path d="M 96 190 A 170 170 0 0 0 96 322" stroke-width="5"/>
    <path d="M 68 162 A 210 210 0 0 0 68 350" stroke-width="3.5" opacity="0.6"/>
    <path d="M 416 190 A 170 170 0 0 1 416 322" stroke-width="5"/>
    <path d="M 444 162 A 210 210 0 0 1 444 350" stroke-width="3.5" opacity="0.6"/>
  </g>

  <!-- ================= LEFT EARBUD (Buds 4 Pro Blade) ================= -->
  <g filter="url(#dropShadow)" transform="translate(0, 6)">
    <!-- Inner Silicone Eartip (pointing inward-up) -->
    <ellipse cx="222" cy="176" rx="28" ry="34" transform="rotate(24 222 176)" fill="url(#earTip)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="228" cy="174" rx="12" ry="16" transform="rotate(24 228 174)" fill="#020617"/>

    <!-- Ergonomic Acoustic Bulb -->
    <ellipse cx="182" cy="186" rx="52" ry="44" transform="rotate(-18 182 186)" fill="url(#metalBodyL)"/>
    <!-- Acoustic Vent Mesh -->
    <ellipse cx="192" cy="176" rx="14" ry="7" transform="rotate(-22 192 176)" fill="#1E293B"/>

    <!-- Angular Prismatic Blade Stem (Left) -->
    <!-- Left facet (light) -->
    <polygon points="140,174 168,184 196,382 166,390" fill="url(#metalBodyL)"/>
    <!-- Right facet (shadowed) -->
    <polygon points="168,184 190,192 214,372 196,382" fill="url(#bladeDark)"/>
    <!-- Bottom angled tip -->
    <polygon points="166,390 196,382 214,372 184,398" fill="#334155"/>

    <!-- Iconic Samsung Blade Light LED Strip -->
    <line x1="169" y1="194" x2="195" y2="374" stroke="url(#bladeLed)" stroke-width="6.5" stroke-linecap="round" filter="url(#ledGlow)"/>
  </g>

  <!-- ================= RIGHT EARBUD (Buds 4 Pro Blade) ================= -->
  <g filter="url(#dropShadow)" transform="translate(0, 6)">
    <!-- Inner Silicone Eartip (pointing inward-up) -->
    <ellipse cx="290" cy="176" rx="28" ry="34" transform="rotate(-24 290 176)" fill="url(#earTip)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="284" cy="174" rx="12" ry="16" transform="rotate(-24 284 174)" fill="#020617"/>

    <!-- Ergonomic Acoustic Bulb -->
    <ellipse cx="330" cy="186" rx="52" ry="44" transform="rotate(18 330 186)" fill="url(#metalBodyR)"/>
    <!-- Acoustic Vent Mesh -->
    <ellipse cx="320" cy="176" rx="14" ry="7" transform="rotate(22 320 176)" fill="#1E293B"/>

    <!-- Angular Prismatic Blade Stem (Right) -->
    <!-- Right facet (light) -->
    <polygon points="372,174 344,184 316,382 346,390" fill="url(#metalBodyR)"/>
    <!-- Left facet (shadowed) -->
    <polygon points="344,184 322,192 298,372 316,382" fill="url(#bladeDark)"/>
    <!-- Bottom angled tip -->
    <polygon points="346,390 316,382 298,372 328,398" fill="#334155"/>

    <!-- Iconic Samsung Blade Light LED Strip -->
    <line x1="343" y1="194" x2="317" y2="374" stroke="url(#bladeLed)" stroke-width="6.5" stroke-linecap="round" filter="url(#ledGlow)"/>
  </g>
</svg>
