[package]
name = "buds4pro"
version = "0.2.0"
edition = "2021"
description = "Gerenciador nativo em Rust para Samsung Galaxy Buds 4 Pro (CLI, System Tray e GUI)"

[dependencies]
anyhow = "1.0"
bluer = { version = "0.17", features = ["rfcomm", "bluetoothd"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures = "0.3"
ksni = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
uuid = "1.10"
